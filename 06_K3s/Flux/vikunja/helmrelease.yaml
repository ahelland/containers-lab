apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vikunja
  namespace: vikunja
spec:
  chart:
    spec:
      chart: vikunja
      version: "2.3.0"
      sourceRef:
        kind: HelmRepository
        name: vikunja
        namespace: vikunja
  interval: 10m

  install:
    remediation:
      retries: 5

  upgrade:
    remediation:
      retries: 5

  values:
    vikunja:
      image:
        pullPolicy: IfNotPresent

      env:
        VIKUNJA_DATABASE_TYPE: "sqlite"

      persistence:
        database:
          enabled: true
          accessMode: ReadWriteOnce
          size: 2Gi
          mountPath: /db
        data:
          enabled: true
          accessMode: ReadWriteOnce
          size: 2Gi
          mountPath: /app/vikunja/files

      ingress:
        main:
          enabled: false