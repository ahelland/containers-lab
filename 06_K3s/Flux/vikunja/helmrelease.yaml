apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vikunja
  namespace: vikunja
spec:
  chart:
    spec:
      chart: vikunja
      version: "2.3.0"
      sourceRef:
        kind: HelmRepository
        name: vikunja
        namespace: vikunja
  interval: 10m

  install:
    remediation:
      retries: 5

  upgrade:
    remediation:
      retries: 5

  values:
    vikunja:
      image:
        pullPolicy: IfNotPresent

      env:
        VIKUNJA_DATABASE_TYPE: "sqlite"

      persistence:
        database:
          enabled: true
          accessMode: ReadWriteOnce
          size: 2Gi
          mountPath: /db
        data:
          enabled: true
          accessMode: ReadWriteOnce
          size: 2Gi
          mountPath: /app/vikunja/files

      ingress:
        main:
          enabled: false

      configMaps:
        config:
          enabled: true
          data:
            # Vikunja requires service.publicurl while cors.enable is true
            # (the default); with publicurl unset the app exits immediately ->
            # CrashLoopBackOff. We keep this file generic (no hard-coded public
            # URL) by simply disabling CORS. If CORS is wanted later, set
            # service.publicurl in the UI / a follow-up ConfigMap.
            config.yml: |
              cors:
                enable: false